name: Cyberfish CI

on:
  push:
    paths:
      - "app/**"
      - "cyberfish-admin/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "cyberfish-admin/**"
      - ".github/workflows/android.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew test lint assembleDebug compileDebugAndroidTestKotlin

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberfish-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cyberfish-admin/package-lock.json
      - run: npm ci
      - run: npm run db:generate --workspace server
      - run: npm run typecheck
      - run: npm run build
